<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bản đồ An toàn PCCC & Cứu hộ - Web Base</title>
    
    <!-- Nhúng thư viện CSS của Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Reset CSS cơ bản */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f5f5f7;
        }

        /* Khung hiển thị bản đồ chiếm toàn màn hình */
        #map {
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* 1. KHUNG CHỨA NÚT CHỨC NĂNG DƯỚI ĐÁY */
        .bottom-action-bar {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 10px 18px;
            border-radius: 35px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        }

        /* 2. CÁC NÚT CHỨC NĂNG HÌNH VUÔNG BO TRÒN GÓC */
        .action-btn {
            width: 50px;
            height: 50px;
            border-radius: 16px;
            border: none;
            background: #ffffff;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .action-btn:hover {
            transform: translateY(-3px) scale(1.06);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            background: #f8fafc;
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        .action-btn.active {
            background: #eff6ff;
            border: 2px solid #2563eb;
            color: #2563eb;
        }

        .action-btn .btn-icon {
            font-size: 19px;
            line-height: 1;
        }

        .action-btn .btn-label {
            font-size: 8.5px;
            font-weight: 700;
            margin-top: 3px;
            color: #475569;
            white-space: nowrap;
        }

        /* 3. TÂM NGẮM Ở GIỮA MÀN HÌNH */
        .crosshair-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1500;
            pointer-events: none;
            display: none;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
        }

        .crosshair-overlay.active {
            display: flex;
        }

        .crosshair-circle {
            width: 36px;
            height: 36px;
            border: 2.5px solid #ef4444;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.1);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
            position: relative;
        }

        .crosshair-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* 4. THANH ĐIỀU KHIỂN KHI BẬT TÂM NGẮM */
        .collector-top-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1600;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 24px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 92vw;
        }

        .collector-top-bar.active {
            display: flex;
        }

        .collector-mode-selector {
            display: flex;
            background: rgba(255,255,255,0.15);
            padding: 4px;
            border-radius: 16px;
            gap: 4px;
        }

        .mode-btn {
            padding: 6px 12px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(37,99,235,0.4);
        }

        .collector-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-sub-btn {
            padding: 8px 14px;
            border-radius: 14px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .btn-primary-action { background: #10b981; color: #ffffff; }
        .btn-primary-action:hover { background: #059669; }
        .btn-secondary-action { background: #3b82f6; color: #ffffff; }
        .btn-cancel-action { background: #ef4444; color: #ffffff; }

        .collector-status {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
            text-align: center;
        }

        /* 5. MODAL POPUP VÀ BẢNG TAB DỮ LIỆU */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 90%;
            max-width: 420px;
            max-height: 85vh;
            background: #ffffff;
            border-radius: 28px;
            padding: 26px 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: scale(0.2) translateY(100px);
            transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1.15);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-close-btn {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #f1f5f9;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 10;
        }

        .modal-close-btn:hover {
            background: #e2e8f0;
            color: #0f172a;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 14px;
            text-align: center;
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 5px;
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            border-color: #2563eb;
        }

        .form-radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s;
        }

        .radio-option input {
            accent-color: #2563eb;
        }

        .radio-option:has(input:checked) {
            border-color: #2563eb;
            background: #eff6ff;
            color: #1e40af;
        }

        .form-submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 16px;
            border: none;
            background: #2563eb;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            transition: background 0.2s;
        }

        .form-submit-btn:hover {
            background: #1d4ed8;
        }

        /* TAB QUẢN LÝ DỮ LIỆU ĐÃ THU THẬP */
        .data-tabs {
            display: flex;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 12px;
            gap: 2px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 2px;
            background: none;
            border: none;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
        }

        .data-list-container {
            flex: 1;
            overflow-y: auto;
            max-height: 50vh;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .data-item-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .data-item-info {
            text-align: left;
        }

        .data-item-title {
            font-size: 13px;
            font-weight: 700;
            color: #0f172a;
        }

        .data-item-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 4px;
        }

        .badge-pccc { background: #fee2e2; color: #dc2626; }
        .badge-water { background: #dbeafe; color: #2563eb; }
        .badge-hospital { background: #dcfce7; color: #16a34a; }
        .badge-water-surface { background: #e0f2fe; color: #0284c7; }
        .badge-alley { background: #ffedd5; color: #ea580c; }
        .badge-road-large { background: #dcfce7; color: #15803d; }
        .badge-road-medium { background: #dbeafe; color: #1d4ed8; }
        .badge-road-small { background: #ffedd5; color: #c2410c; }
        .badge-road-narrow { background: #fee2e2; color: #b91c1c; }
        .badge-ppgis { background: #f3e8ff; color: #7e22ce; }

        .data-item-actions {
            display: flex;
            gap: 6px;
        }

        .item-action-btn {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            border: none;
            background: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 14px;
        }

        /* KHUNG HIỂN THỊ ĐIỂM SỐ AN TOÀN PCCC */
        .score-display-box {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            color: white;
            border-radius: 20px;
            padding: 16px;
            text-align: center;
            margin-bottom: 14px;
            box-shadow: 0 8px 20px rgba(49, 46, 129, 0.3);
        }

        .score-number {
            font-size: 38px;
            font-weight: 900;
            line-height: 1;
            margin: 6px 0;
        }

        .score-level-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .score-detail-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            font-size: 12px;
            max-height: 35vh;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .score-detail-item {
            background: #f8fafc;
            border-radius: 12px;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Pulse animation */
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { transform: scale(1.15); box-shadow: 0 0 0 14px rgba(37, 99, 235, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
    </style>
</head>
<body>

    <!-- Khung Bản đồ Google Maps -->
    <div id="map"></div>

    <!-- Tâm ngắm cố định ở giữa màn hình -->
    <div class="crosshair-overlay" id="crosshairOverlay">
        <div class="crosshair-circle">
            <div class="crosshair-dot"></div>
        </div>
    </div>

    <!-- Thanh điều khiển phía trên khi bật tâm ngắm -->
    <div class="collector-top-bar" id="collectorTopBar">
        <div class="collector-mode-selector">
            <button class="mode-btn active" id="modePointBtn" onclick="switchCollectMode('point')">📍 Chọn Điểm</button>
            <button class="mode-btn" id="modeRegionBtn" onclick="switchCollectMode('region')">🔷 Chọn Vùng</button>
            <button class="mode-btn" id="modeRoadBtn" onclick="switchCollectMode('road')">🛣️ Tuyến ngõ</button>
        </div>

        <!-- Các nút bấm tương ứng theo Chế độ -->
        <div class="collector-actions">
            <!-- Nút chế độ Chọn Điểm -->
            <button class="action-sub-btn btn-primary-action" id="btnSavePoint" onclick="confirmPointSelection()">
                📌 Lưu vị trí tâm ngắm
            </button>

            <!-- Các nút chế độ Chọn Vùng -->
            <button class="action-sub-btn btn-secondary-action" id="btnAddVertex" onclick="addPolygonVertex()" style="display: none;">
                ➕ Thêm đỉnh
            </button>
            <button class="action-sub-btn btn-primary-action" id="btnFinishRegion" onclick="finishPolygonRegion()" style="display: none;">
                ✅ Khép kín & Lưu vùng
            </button>
            <button class="action-sub-btn btn-cancel-action" id="btnResetRegion" onclick="resetPolygonVertices()" style="display: none;">
                🗑️ Làm lại
            </button>

            <!-- Các nút chế độ Chọn Tuyến ngõ -->
            <button class="action-sub-btn btn-secondary-action" id="btnAddRoadPoint" onclick="addRoadPoint()" style="display: none;">
                ➕ Thêm điểm đường
            </button>
            <button class="action-sub-btn btn-primary-action" id="btnFinishRoad" onclick="finishRoadLine()" style="display: none;">
                ✅ Hoàn tất tuyến ngõ
            </button>
            <button class="action-sub-btn btn-cancel-action" id="btnResetRoad" onclick="resetRoadPoints()" style="display: none;">
                🗑️ Làm lại
            </button>

            <!-- Nút bấm chế độ Chấm Điểm & PPGIS -->
            <button class="action-sub-btn btn-primary-action" id="btnCalculateScore" onclick="executeCalculateScore()" style="display: none;">
                ⚡ Tính điểm tọa độ này
            </button>
            <button class="action-sub-btn btn-primary-action" id="btnSubmitPPGIS" onclick="openPPGISFormForCoords()" style="display: none;">
                📝 Tạo phản ánh vị trí này
            </button>
        </div>

        <div class="collector-status" id="collectorStatusText">Di chuyển bản đồ để đưa tâm ngắm tới vị trí cần lưu</div>
    </div>

    <!-- Thanh khung ngang bo tròn mạnh chứa các nút chức năng chính -->
    <div class="bottom-action-bar">
        <!-- Nút 1: Định vị GPS hiện tại -->
        <button class="action-btn" onclick="handleGPSClick()" title="Định vị GPS">
            <span class="btn-icon">📍</span>
            <span class="btn-label">GPS</span>
        </button>

        <!-- Nút 2: Nút Đánh dấu / Thu thập địa điểm & vùng & đường -->
        <button class="action-btn" id="toggleCollectBtn" onclick="toggleCollectMode()" title="Đánh dấu địa điểm/vùng/đường">
            <span class="btn-icon">🎯</span>
            <span class="btn-label">Thu thập</span>
        </button>

        <!-- Nút 3: Nút Xem Tab dữ liệu đã thu thập -->
        <button class="action-btn" onclick="openDataManagementModal()" title="Dữ liệu đã thu thập">
            <span class="btn-icon">🗂️</span>
            <span class="btn-label">Dữ liệu</span>
        </button>

        <!-- Nút 4: Đóng góp cộng đồng PPGIS -->
        <button class="action-btn" id="ppgisBtn" onclick="openPPGISModal()" title="Đóng góp phản ánh cộng đồng">
            <span class="btn-icon">🤝</span>
            <span class="btn-label">Cộng đồng</span>
        </button>

        <!-- Nút 5: Chấm điểm an toàn PCCC -->
        <button class="action-btn" id="scoreBtn" onclick="openSafetyScoreModal()" title="Chấm điểm an toàn tọa độ">
            <span class="btn-icon">🛡️</span>
            <span class="btn-label">Chấm điểm</span>
        </button>
    </div>

    <!-- MODAL 1: Form Lưu Điểm mới -->
    <div class="modal-overlay" id="savePointModal">
        <div class="modal-card">
            <button class="modal-close-btn" onclick="closeModal('savePointModal')">✕</button>
            <h3 class="modal-title">📌 Thêm Điểm Mới</h3>
            
            <div class="form-group">
                <label class="form-label">Tên địa điểm / Tên họng nước / Bệnh viện</label>
                <input type="text" id="pointNameInput" class="form-input" placeholder="Ví dụ: Bệnh viện Bạch Mai, Trụ nước hẻm 45..." />
            </div>

            <div class="form-group">
                <label class="form-label">Tọa độ đã chọn</label>
                <input type="text" id="pointCoordsDisplay" class="form-input" readonly style="background: #f1f5f9; color: #64748b;" />
            </div>

            <div class="form-group">
                <label class="form-label">Phân loại địa điểm</label>
                <div class="form-radio-group">
                    <label class="radio-option">
                        <input type="radio" name="pointCategory" value="pccc_station" checked />
                        <span>🚒 Trạm PCCC</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="pointCategory" value="water_point" />
                        <span>💧 Điểm cấp nước (Trụ/Họng nước)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="pointCategory" value="hospital" />
                        <span>🏥 Bệnh viện / Cơ sở y tế</span>
                    </label>
                </div>
            </div>

            <button class="form-submit-btn" onclick="savePointToDatabase()">💾 Lưu vào Cơ sở Dữ liệu</button>
        </div>
    </div>

    <!-- MODAL 2: Form Lưu Vùng mới -->
    <div class="modal-overlay" id="saveRegionModal">
        <div class="modal-card">
            <button class="modal-close-btn" onclick="closeModal('saveRegionModal')">✕</button>
            <h3 class="modal-title">🔷 Thêm Vùng Mới</h3>
            
            <div class="form-group">
                <label class="form-label">Tên khu vực / Tên vùng</label>
                <input type="text" id="regionNameInput" class="form-input" placeholder="Ví dụ: Ao Đình Phường X, Ngõ hẹp khu A..." />
            </div>

            <div class="form-group">
                <label class="form-label">Thông tin số đỉnh</label>
                <input type="text" id="regionVerticesDisplay" class="form-input" readonly style="background: #f1f5f9; color: #64748b;" />
            </div>

            <div class="form-group">
                <label class="form-label">Phân loại vùng</label>
                <div class="form-radio-group">
                    <label class="radio-option">
                        <input type="radio" name="regionCategory" value="water_surface" checked />
                        <span>🌊 Bề mặt nước (Ao, Hồ, Bể lớn)</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="regionCategory" value="narrow_alley_cluster" />
                        <span>🏘️ Cụm dân cư trong ngõ nhỏ</span>
                    </label>
                </div>
            </div>

            <button class="form-submit-btn" onclick="saveRegionToDatabase()">💾 Khép kín & Lưu Vùng</button>
        </div>
    </div>

    <!-- MODAL 2B: Form Lưu Tuyến Ngõ mới -->
    <div class="modal-overlay" id="saveRoadModal">
        <div class="modal-card">
            <button class="modal-close-btn" onclick="closeModal('saveRoadModal')">✕</button>
            <h3 class="modal-title">🛣️ Thêm Tuyến Ngõ Mới</h3>
            
            <div class="form-group">
                <label class="form-label">Tên tuyến ngõ / ngách</label>
                <input type="text" id="roadNameInput" class="form-input" placeholder="Ví dụ: Ngõ 1194 Đường Láng - Nhánh 2..." />
            </div>

            <div class="form-group">
                <label class="form-label">Độ rộng trung bình ngõ (mét)</label>
                <input type="number" id="roadWidthInput" class="form-input" placeholder="Ví dụ: 2.8" step="0.1" min="0.5" oninput="updateRoadClassPreview()" />
            </div>

            <div class="form-group">
                <label class="form-label">Khả năng đáp ứng PCCC (Tự động)</label>
                <div id="roadClassPreview" style="padding: 12px 14px; border-radius: 12px; background: #f8fafc; border: 1.5px solid #e2e8f0; font-size: 12px; font-weight: 600; color: #64748b; line-height: 1.4;">
                    Vui lòng nhập số mét độ rộng ngõ...
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Số điểm định vị</label>
                <input type="text" id="roadPointsDisplay" class="form-input" readonly style="background: #f1f5f9; color: #64748b;" />
            </div>

            <button class="form-submit-btn" onclick="saveRoadToDatabase()">💾 Lưu Tuyến Ngõ vào DB</button>
        </div>
    </div>

    <!-- MODAL 3: Form Đóng góp Phản ánh PPGIS Cộng đồng -->
    <div class="modal-overlay" id="savePPGISModal">
        <div class="modal-card">
            <button class="modal-close-btn" onclick="closeModal('savePPGISModal')">✕</button>
            <h3 class="modal-title">🤝 Đóng Góp Phản Ánh PPGIS</h3>
            
            <div class="form-group">
                <label class="form-label">Tiêu đề phản ánh / Nội dung ngắn</label>
                <input type="text" id="ppgisTitleInput" class="form-input" placeholder="Ví dụ: Ngõ 85 bị bít lối do bãi xe, Họng nước bị kẹt..." />
            </div>

            <div class="form-group">
                <label class="form-label">Tọa độ phản ánh</label>
                <input type="text" id="ppgisCoordsDisplay" class="form-input" readonly style="background: #f1f5f9; color: #64748b;" />
            </div>

            <div class="form-group">
                <label class="form-label">Loại phản ánh an toàn PCCC</label>
                <select id="ppgisCategorySelect" class="form-select">
                    <option value="obstacle">🚫 Vật cản ngõ hẹp (Mái che, xe đỗ, rào chắn)</option>
                    <option value="electric_hazard">⚡ Dây điện/Trạm biến áp có nguy cơ chập cháy</option>
                    <option value="damaged_hydrant">💧 Trụ/Họng nước bị hỏng hoặc thiếu thiết bị</option>
                    <option value="extinguisher">🧯 Điểm bình chữa cháy công cộng tự trang bị</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Mô tả chi tiết bổ sung</label>
                <textarea id="ppgisDescInput" class="form-textarea" rows="3" placeholder="Nhập thêm chi tiết nếu có..."></textarea>
            </div>

            <button class="form-submit-btn" onclick="savePPGISToDatabase()">📤 Đẩy Phản Ánh Lên DB</button>
        </div>
    </div>

    <!-- MODAL 4: Kết Quả Chấm Điểm An Toàn PCCC -->
    <div class="modal-overlay" id="scoreResultModal">
        <div class="modal-card">
            <button class="modal-close-btn" onclick="closeModal('scoreResultModal')">✕</button>
            <h3 class="modal-title">🛡️ Đánh Giá An Toàn PCCC</h3>

            <div class="score-display-box">
                <div style="font-size: 12px; opacity: 0.8; font-weight: 700;">CHỈ SỐ AN TOÀN PCCC (AHP SCORE)</div>
                <div class="score-number" id="scoreValueDisplay">--</div>
                <div class="score-level-badge" id="scoreBadgeDisplay">--</div>
            </div>

            <div class="score-detail-list" id="scoreBreakdownContainer">
                <!-- Javascript sẽ tự động điền phân tích ở đây -->
            </div>

            <button class="form-submit-btn" onclick="closeModal('scoreResultModal')">Đã Hiểu</button>
        </div>
    </div>

    <!-- MODAL 5: Tab Quản lý Dữ liệu đã thu thập -->
    <div class="modal-overlay" id="dataManagementModal">
        <div class="modal-card">
            <button class="modal-close-btn" onclick="closeModal('dataManagementModal')">✕</button>
            <h3 class="modal-title">🗂️ Dữ Liệu Đã Thu Thập</h3>

            <div class="data-tabs">
                <button class="tab-btn active" id="tabPointsBtn" onclick="switchDataTab('points')">📍 Điểm</button>
                <button class="tab-btn" id="tabRegionsBtn" onclick="switchDataTab('regions')">🔷 Vùng</button>
                <button class="tab-btn" id="tabRoadsBtn" onclick="switchDataTab('roads')">🛣️ Tuyến ngõ</button>
                <button class="tab-btn" id="tabPPGISBtn" onclick="switchDataTab('ppgis')">🤝 PPGIS</button>
            </div>

            <!-- Danh sách Điểm -->
            <div class="data-list-container" id="pointsListContainer"></div>

            <!-- Danh sách Vùng -->
            <div class="data-list-container" id="regionsListContainer" style="display: none;"></div>

            <!-- Danh sách Tuyến ngõ -->
            <div class="data-list-container" id="roadsListContainer" style="display: none;"></div>

            <!-- Danh sách Phản ánh PPGIS -->
            <div class="data-list-container" id="ppgisListContainer" style="display: none;"></div>
        </div>
    </div>

    <!-- SDK Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <!-- Thư viện Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // ==========================================
        // 1. CẤU HÌNH FIREBASE & BỘ LƯU TRỮ LOCAL
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://pccc-nckh-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };

        let db = null;
        let isFirebaseConnected = false;

        try {
            if (typeof firebase !== 'undefined' && firebaseConfig.databaseURL) {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isFirebaseConnected = true;
                console.log("🔥 Đã kết nối thành công Firebase Realtime Database!");
            }
        } catch (e) {
            console.warn("⚠️ Lỗi kết nối Firebase, tự động dùng LocalStorage dự phòng.", e);
        }

        // ==========================================
        // 2. KHỞI TẠO BẢN ĐỒ LEAFLET & CÁC NỀN LAYER
        // ==========================================
        const map = L.map('map', { zoomControl: false }).setView([21.028511, 105.804817], 15);

        // Layer 0: Bản đồ nền Google Maps Roadmap
        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: '&copy; Google Maps'
        }).addTo(map);

        // LayerGroups chứa dữ liệu thu thập
        const savedPointsGroup = L.layerGroup().addTo(map);
        const savedRegionsGroup = L.layerGroup().addTo(map);
        const savedRoadsGroup = L.layerGroup().addTo(map);
        const ppgisReportsGroup = L.layerGroup().addTo(map);
        const drawTempGroup = L.layerGroup().addTo(map);

        // Bộ quản lý bật/tắt Layer
        const overlayLayers = {
            "📍 Lớp Các Điểm Thu Thập": savedPointsGroup,
            "🔷 Lớp Các Vùng Thu Thập": savedRegionsGroup,
            "🛣️ Lớp Phân Loại Tuyến Ngõ": savedRoadsGroup,
            "🤝 Lớp Phản Ánh PPGIS": ppgisReportsGroup
        };
        L.control.layers(null, overlayLayers, { position: 'topright', collapsed: false }).addTo(map);

        // ==========================================
        // 3. ĐỊNH VỊ GPS PHONG CÁCH CMD HEALTH
        // ==========================================
        let userMarker = null;
        let userAccuracyCircle = null;

        function handleGPSClick() {
            if (!navigator.geolocation) {
                alert("Trình duyệt không hỗ trợ Geolocation!");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    map.flyTo([lat, lng], 17, { animate: true, duration: 1.5 });

                    const gpsIcon = L.divIcon({
                        className: 'cmd-gps-icon',
                        html: `<div style="width: 22px; height: 22px; background: #2563eb; border: 3px solid #ffffff; border-radius: 50%; box-shadow: 0 0 12px rgba(37,99,235,0.8); animation: pulse 1.8s infinite;"></div>`,
                        iconSize: [22, 22],
                        iconAnchor: [11, 11]
                    });

                    if (!userMarker) {
                        userMarker = L.marker([lat, lng], { icon: gpsIcon }).addTo(map);
                    } else {
                        userMarker.setLatLng([lat, lng]);
                    }

                    if (!userAccuracyCircle) {
                        userAccuracyCircle = L.circle([lat, lng], {
                            radius: accuracy,
                            color: '#2563eb',
                            fillColor: '#60a5fa',
                            fillOpacity: 0.2,
                            weight: 1.5
                        }).addTo(map);
                    } else {
                        userAccuracyCircle.setLatLng([lat, lng]);
                        userAccuracyCircle.setRadius(accuracy);
                    }

                    userMarker.bindPopup(`
                        <div style="text-align: center;">
                            <b>📍 Vị trí GPS hiện tại</b><br>
                            <span style="font-size: 11px; color: #475569;">
                                Tọa độ: ${lat.toFixed(5)}, ${lng.toFixed(5)}<br>
                                Độ chính xác: ~${Math.round(accuracy)}m
                            </span>
                        </div>
                    `).openPopup();
                },
                (error) => {
                    alert("Không thể lấy vị trí. Vui lòng bật GPS trên thiết bị!");
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        // ==========================================
        // 4. CHỨC NĂNG TÂM NGẮM & THU THẬP ĐIỂM / VÙNG / NGÕ
        // ==========================================
        let isCollectModeActive = false;
        let currentCollectMode = 'point'; // 'point', 'region', 'road', 'ppgis_pick', 'score_pick'
        let polygonVertices = [];
        let roadPoints = [];
        let tempPolyline = null;
        let pendingPointCoords = null;

        function toggleCollectMode() {
            isCollectModeActive = !isCollectModeActive;
            const btn = document.getElementById('toggleCollectBtn');
            const crosshair = document.getElementById('crosshairOverlay');
            const topBar = document.getElementById('collectorTopBar');

            if (isCollectModeActive) {
                btn.classList.add('active');
                crosshair.classList.add('active');
                topBar.classList.add('active');
                switchCollectMode(currentCollectMode);
            } else {
                btn.classList.remove('active');
                crosshair.classList.remove('active');
                topBar.classList.remove('active');
                resetPolygonVertices();
                resetRoadPoints();
            }
        }

        function switchCollectMode(mode) {
            currentCollectMode = mode;
            document.getElementById('modePointBtn').classList.toggle('active', mode === 'point');
            document.getElementById('modeRegionBtn').classList.toggle('active', mode === 'region');
            document.getElementById('modeRoadBtn').classList.toggle('active', mode === 'road');

            const btnSavePoint = document.getElementById('btnSavePoint');
            const btnAddVertex = document.getElementById('btnAddVertex');
            const btnFinishRegion = document.getElementById('btnFinishRegion');
            const btnResetRegion = document.getElementById('btnResetRegion');
            
            const btnAddRoadPoint = document.getElementById('btnAddRoadPoint');
            const btnFinishRoad = document.getElementById('btnFinishRoad');
            const btnResetRoad = document.getElementById('btnResetRoad');

            const btnCalculateScore = document.getElementById('btnCalculateScore');
            const btnSubmitPPGIS = document.getElementById('btnSubmitPPGIS');
            
            const statusText = document.getElementById('collectorStatusText');

            resetPolygonVertices();
            resetRoadPoints();

            // Ẩn toàn bộ nút phụ
            btnSavePoint.style.display = 'none';
            btnAddVertex.style.display = 'none';
            btnFinishRegion.style.display = 'none';
            btnResetRegion.style.display = 'none';
            btnAddRoadPoint.style.display = 'none';
            btnFinishRoad.style.display = 'none';
            btnResetRoad.style.display = 'none';
            btnCalculateScore.style.display = 'none';
            btnSubmitPPGIS.style.display = 'none';

            if (mode === 'point') {
                btnSavePoint.style.display = 'inline-flex';
                statusText.innerText = "Di chuyển bản đồ để đưa tâm ngắm tới điểm cần đặt Marker";
            } else if (mode === 'region') {
                btnAddVertex.style.display = 'inline-flex';
                btnFinishRegion.style.display = 'inline-flex';
                btnResetRegion.style.display = 'inline-flex';
                updateRegionStatusText();
            } else if (mode === 'road') {
                btnAddRoadPoint.style.display = 'inline-flex';
                btnFinishRoad.style.display = 'inline-flex';
                btnResetRoad.style.display = 'inline-flex';
                updateRoadStatusText();
            } else if (mode === 'score_pick') {
                btnCalculateScore.style.display = 'inline-flex';
                statusText.innerText = "Di chuyển bản đồ để đưa tâm ngắm tới vị trí cần chấm điểm an toàn PCCC";
            } else if (mode === 'ppgis_pick') {
                btnSubmitPPGIS.style.display = 'inline-flex';
                statusText.innerText = "Di chuyển bản đồ để đưa tâm ngắm tới vị trí cần gửi phản ánh PPGIS";
            }
        }

        // --- ĐIỂM ---
        function confirmPointSelection() {
            const center = map.getCenter();
            pendingPointCoords = { lat: center.lat, lng: center.lng };
            document.getElementById('pointCoordsDisplay').value = `${center.lat.toFixed(6)}, ${center.lng.toFixed(6)}`;
            document.getElementById('pointNameInput').value = '';
            openModal('savePointModal');
        }

        // --- VÙNG ---
        function addPolygonVertex() {
            const center = map.getCenter();
            polygonVertices.push([center.lat, center.lng]);

            const vertexMarker = L.circleMarker([center.lat, center.lng], {
                radius: 5, color: '#2563eb', fillColor: '#ffffff', fillOpacity: 1, weight: 2
            });
            drawTempGroup.addLayer(vertexMarker);

            if (polygonVertices.length > 1) {
                if (tempPolyline) drawTempGroup.removeLayer(tempPolyline);
                tempPolyline = L.polyline(polygonVertices, { color: '#2563eb', weight: 2.5, dashArray: '6, 6' });
                drawTempGroup.addLayer(tempPolyline);
            }
            updateRegionStatusText();
        }

        function updateRegionStatusText() {
            document.getElementById('collectorStatusText').innerText = `Đã chọn ${polygonVertices.length} đỉnh. (Cần ít nhất 3 đỉnh để làm vùng khép kín)`;
        }

        function resetPolygonVertices() {
            polygonVertices = [];
            drawTempGroup.clearLayers();
            if (tempPolyline) tempPolyline = null;
        }

        function finishPolygonRegion() {
            if (polygonVertices.length < 3) {
                alert("Vui lòng chọn ít nhất 3 đỉnh để tạo thành một vùng khép kín!");
                return;
            }
            document.getElementById('regionVerticesDisplay').value = `${polygonVertices.length} đỉnh đã chọn (Tự động khép kín)`;
            document.getElementById('regionNameInput').value = '';
            openModal('saveRegionModal');
        }

        // --- TUYẾN NGÕ ---
        function addRoadPoint() {
            const center = map.getCenter();
            roadPoints.push([center.lat, center.lng]);

            const pointMarker = L.circleMarker([center.lat, center.lng], {
                radius: 4, color: '#10b981', fillColor: '#ffffff', fillOpacity: 1, weight: 2
            });
            drawTempGroup.addLayer(pointMarker);

            if (roadPoints.length > 1) {
                if (tempPolyline) drawTempGroup.removeLayer(tempPolyline);
                tempPolyline = L.polyline(roadPoints, { color: '#10b981', weight: 3.5, dashArray: '4, 4' });
                drawTempGroup.addLayer(tempPolyline);
            }
            updateRoadStatusText();
        }

        function updateRoadStatusText() {
            document.getElementById('collectorStatusText').innerText = `Đã chọn ${roadPoints.length} điểm định vị tuyến ngõ. (Cần ít nhất 2 điểm)`;
        }

        function resetRoadPoints() {
            roadPoints = [];
            drawTempGroup.clearLayers();
            if (tempPolyline) tempPolyline = null;
        }

        function finishRoadLine() {
            if (roadPoints.length < 2) {
                alert("Vui lòng chọn ít nhất 2 điểm để tạo thành một tuyến ngõ!");
                return;
            }
            document.getElementById('roadPointsDisplay').value = `${roadPoints.length} điểm định vị tuyến ngõ`;
            document.getElementById('roadNameInput').value = '';
            document.getElementById('roadWidthInput').value = '';
            document.getElementById('roadClassPreview').innerHTML = 'Vui lòng nhập số mét độ rộng ngõ...';
            openModal('saveRoadModal');
        }

        // Thuật toán Phân loại Ngõ PCCC theo QCVN 06:2022/BXD
        function classifyRoad(w) {
            const width = parseFloat(w);
            if (isNaN(width) || width <= 0) {
                return { category: 'unknown', label: 'Chưa xác định', color: '#64748b', badgeClass: 'badge-water', desc: 'Vui lòng nhập số mét độ rộng ngõ hợp lệ.' };
            }
            if (width >= 5.0) {
                return { category: 'large_alley', label: '🟢 Ngõ lớn (≥ 5.0m)', color: '#10b981', badgeClass: 'badge-road-large', desc: '<b>Xe PCCC cỡ lớn, xe thang, xe téc nước</b> di chuyển & đỗ triển khai chân chống cứu nạn tốt.' };
            } else if (width >= 3.5) {
                return { category: 'medium_alley', label: '🔵 Ngõ vừa (3.5m - <5.0m)', color: '#2563eb', badgeClass: 'badge-road-medium', desc: '<b>1 xe chữa cháy tiêu chuẩn</b> vào được (chuẩn QCVN). Hai xe ngược chiều KHÔNG thể tránh nhau.' };
            } else if (width >= 2.0) {
                return { category: 'small_alley', label: '🟠 Ngõ nhỏ (2.0m - <3.5m)', color: '#f97316', badgeClass: 'badge-road-small', desc: '<b>Xe PCCC tiêu chuẩn KHÔNG vào được.</b> Chỉ xe chữa cháy mini, xe mô tô PCCC 2 bánh, máy bơm khiêng tay.' };
            } else {
                return { category: 'narrow_alley', label: '🔴 Ngõ/ngách hẹp (< 2.0m)', color: '#ef4444', badgeClass: 'badge-road-narrow', desc: '<b>CẤM HOÀN TOÀN XE CƠ GIỚI.</b> Lực lượng cứu nạn chỉ đi bộ, kéo xe bồn mini, dùng máy bơm xách tay/thả phao.' };
            }
        }

        function updateRoadClassPreview() {
            const w = document.getElementById('roadWidthInput').value;
            const res = classifyRoad(w);
            document.getElementById('roadClassPreview').innerHTML = `<div style="color: ${res.color}; font-weight: 800; margin-bottom: 3px;">${res.label}</div><div>${res.desc}</div>`;
        }

        // ==========================================
        // 5. CHỨC NĂNG ĐÓNG GÓP CỘNG ĐỒNG (PPGIS)
        // ==========================================
        function openPPGISModal() {
            if (!isCollectModeActive) {
                isCollectModeActive = true;
                document.getElementById('toggleCollectBtn').classList.add('active');
                document.getElementById('crosshairOverlay').classList.add('active');
                document.getElementById('collectorTopBar').classList.add('active');
            }
            switchCollectMode('ppgis_pick');
        }

        function openPPGISFormForCoords() {
            const center = map.getCenter();
            pendingPointCoords = { lat: center.lat, lng: center.lng };
            document.getElementById('ppgisCoordsDisplay').value = `${center.lat.toFixed(6)}, ${center.lng.toFixed(6)}`;
            document.getElementById('ppgisTitleInput').value = '';
            document.getElementById('ppgisDescInput').value = '';
            openModal('savePPGISModal');
        }

        function savePPGISToDatabase() {
            const title = document.getElementById('ppgisTitleInput').value.trim() || "Phản ánh không tên";
            const category = document.getElementById('ppgisCategorySelect').value;
            const desc = document.getElementById('ppgisDescInput').value.trim();

            const ppgisData = {
                id: 'ppgis_' + Date.now(),
                title: title,
                category: category,
                description: desc,
                lat: pendingPointCoords.lat,
                lng: pendingPointCoords.lng,
                createdAt: new Date().toISOString()
            };

            if (isFirebaseConnected && db) {
                db.ref('pccc_data/ppgis/' + ppgisData.id).set(ppgisData);
            } else {
                saveToLocalStorage('ppgis', ppgisData);
            }

            closeModal('savePPGISModal');
            toggleCollectMode();
            loadAndRenderData();
            alert("✅ Đã gửi phản ánh PPGIS lên Cơ sở dữ liệu thành công!");
        }

        // ==========================================
        // 6. THUẬT TOÁN CHẤM ĐIỂM AN TOÀN PCCC (AHP MODEL)
        // ==========================================
        function openSafetyScoreModal() {
            if (!isCollectModeActive) {
                isCollectModeActive = true;
                document.getElementById('toggleCollectBtn').classList.add('active');
                document.getElementById('crosshairOverlay').classList.add('active');
                document.getElementById('collectorTopBar').classList.add('active');
            }
            switchCollectMode('score_pick');
        }

        function executeCalculateScore() {
            const center = map.getCenter();
            calculateSafetyScore(center.lat, center.lng);
        }

        function calculateSafetyScore(targetLat, targetLng) {
            // Lấy toàn bộ dữ liệu đã thu thập
            const points = isFirebaseConnected ? window.cachedPoints || [] : getFromLocalStorage('points');
            const roads = isFirebaseConnected ? window.cachedRoads || [] : getFromLocalStorage('roads');

            // 1. Khoảng cách đến Trạm PCCC gần nhất
            const fireStations = points.filter(p => p.category === 'pccc_station');
            let minDistFireStation = 999; // km
            if (fireStations.length > 0) {
                fireStations.forEach(st => {
                    const d = map.distance([targetLat, targetLng], [st.lat, st.lng]) / 1000;
                    if (d < minDistFireStation) minDistFireStation = d;
                });
            } else {
                minDistFireStation = 2.5; // Mặc định 2.5km nếu chưa có dữ liệu
            }

            // 2. Khoảng cách đến Nguồn nước gần nhất
            const waterPoints = points.filter(p => p.category === 'water_point');
            let minDistWater = 999; // meters
            if (waterPoints.length > 0) {
                waterPoints.forEach(wp => {
                    const d = map.distance([targetLat, targetLng], [wp.lat, wp.lng]);
                    if (d < minDistWater) minDistWater = d;
                });
            } else {
                minDistWater = 280; // Mặc định 280m
            }

            // 3. Khoảng cách đến Bệnh viện gần nhất
            const hospitals = points.filter(p => p.category === 'hospital');
            let minDistHospital = 999; // km
            if (hospitals.length > 0) {
                hospitals.forEach(hp => {
                    const d = map.distance([targetLat, targetLng], [hp.lat, hp.lng]) / 1000;
                    if (d < minDistHospital) minDistHospital = d;
                });
            } else {
                minDistHospital = 3.5;
            }

            // 4. Độ rộng ngõ gần nhất
            let minAlleyWidth = 4.0;
            if (roads.length > 0) {
                let minDistRoad = 999;
                roads.forEach(rd => {
                    if (rd.path && rd.path.length > 0) {
                        const d = map.distance([targetLat, targetLng], rd.path[0]);
                        if (d < minDistRoad) {
                            minDistRoad = d;
                            minAlleyWidth = rd.width || 3.0;
                        }
                    }
                });
            }

            // --- TÍNH ĐIỂM THÀNH PHẦN (Thang 100) ---
            let scoreFireStation = 100;
            if (minDistFireStation > 5) scoreFireStation = 10;
            else if (minDistFireStation > 3) scoreFireStation = 40;
            else if (minDistFireStation > 1.5) scoreFireStation = 75;

            let scoreWater = 100;
            if (minDistWater > 500) scoreWater = 10;
            else if (minDistWater > 300) scoreWater = 40;
            else if (minDistWater > 150) scoreWater = 70;

            let scoreRoad = 100;
            if (minAlleyWidth < 2.0) scoreRoad = 15;
            else if (minAlleyWidth < 3.5) scoreRoad = 45;
            else if (minAlleyWidth < 5.0) scoreRoad = 80;

            let scoreHospital = 100;
            if (minDistHospital > 6) scoreHospital = 30;
            else if (minDistHospital > 3) scoreHospital = 70;

            // CHỈ SỐ TỔNG HỢP AHP
            const totalScore = Math.round(
                (scoreFireStation * 0.35) +
                (scoreWater * 0.30) +
                (scoreRoad * 0.25) +
                (scoreHospital * 0.10)
            );

            // Đánh giá cấp độ
            let levelText = "🟢 RẤT AN TOÀN";
            let levelColor = "#10b981";
            if (totalScore < 40) {
                levelText = "🔴 NGUY CƠ CAO (ĐIỂM MÙ PCCC)";
                levelColor = "#ef4444";
            } else if (totalScore < 60) {
                levelText = "🟠 NGUY CƠ TRUNG BÌNH";
                levelColor = "#f97316";
            } else if (totalScore < 80) {
                levelText = "🔵 AN TOÀN KHÁ";
                levelColor = "#2563eb";
            }

            // Bơm ra Modal giao diện
            document.getElementById('scoreValueDisplay').innerText = totalScore + "/100";
            const badgeEl = document.getElementById('scoreBadgeDisplay');
            badgeEl.innerText = levelText;
            badgeEl.style.backgroundColor = levelColor;
            badgeEl.style.color = '#ffffff';

            document.getElementById('scoreBreakdownContainer').innerHTML = `
                <div class="score-detail-item">
                    <span>🚒 Trạm PCCC gần nhất (~${minDistFireStation.toFixed(1)}km)</span>
                    <b style="color: #2563eb;">${scoreFireStation}đ</b>
                </div>
                <div class="score-detail-item">
                    <span>💧 Họng nước/Nguồn nước gần nhất (~${Math.round(minDistWater)}m)</span>
                    <b style="color: #2563eb;">${scoreWater}đ</b>
                </div>
                <div class="score-detail-item">
                    <span>🛣️ Độ rộng ngõ tiếp cận (~${minAlleyWidth}m)</span>
                    <b style="color: #2563eb;">${scoreRoad}đ</b>
                </div>
                <div class="score-detail-item">
                    <span>🏥 Bệnh viện cứu thương (~${minDistHospital.toFixed(1)}km)</span>
                    <b style="color: #2563eb;">${scoreHospital}đ</b>
                </div>
            `;

            openModal('scoreResultModal');
        }

        // ==========================================
        // 7. LƯU THÔNG TIN VÀO DATABASE
        // ==========================================
        function savePointToDatabase() {
            const name = document.getElementById('pointNameInput').value.trim() || "Điểm chưa đặt tên";
            const category = document.querySelector('input[name="pointCategory"]:checked').value;

            const pointData = {
                id: 'point_' + Date.now(),
                name: name,
                category: category,
                lat: pendingPointCoords.lat,
                lng: pendingPointCoords.lng,
                createdAt: new Date().toISOString()
            };

            if (isFirebaseConnected && db) {
                db.ref('pccc_data/points/' + pointData.id).set(pointData);
            } else {
                saveToLocalStorage('points', pointData);
            }

            closeModal('savePointModal');
            loadAndRenderData();
            alert("✅ Đã lưu điểm thành công!");
        }

        function saveRegionToDatabase() {
            const name = document.getElementById('regionNameInput').value.trim() || "Vùng chưa đặt tên";
            const category = document.querySelector('input[name="regionCategory"]:checked').value;

            const closedVertices = [...polygonVertices];
            if (closedVertices.length > 0) {
                if (closedVertices[0][0] !== closedVertices[closedVertices.length - 1][0] ||
                    closedVertices[0][1] !== closedVertices[closedVertices.length - 1][1]) {
                    closedVertices.push(closedVertices[0]);
                }
            }

            const regionData = {
                id: 'region_' + Date.now(),
                name: name,
                category: category,
                vertices: closedVertices,
                createdAt: new Date().toISOString()
            };

            if (isFirebaseConnected && db) {
                db.ref('pccc_data/regions/' + regionData.id).set(regionData);
            } else {
                saveToLocalStorage('regions', regionData);
            }

            closeModal('saveRegionModal');
            resetPolygonVertices();
            loadAndRenderData();
            alert("✅ Đã lưu vùng khép kín thành công!");
        }

        function saveRoadToDatabase() {
            const name = document.getElementById('roadNameInput').value.trim() || "Ngõ chưa đặt tên";
            const widthVal = parseFloat(document.getElementById('roadWidthInput').value);

            if (isNaN(widthVal) || widthVal <= 0) {
                alert("Vui lòng nhập độ rộng ngõ hợp lệ!");
                return;
            }

            const classInfo = classifyRoad(widthVal);

            const roadData = {
                id: 'road_' + Date.now(),
                name: name,
                width: widthVal,
                category: classInfo.category,
                categoryLabel: classInfo.label,
                color: classInfo.color,
                description: classInfo.desc,
                path: roadPoints,
                createdAt: new Date().toISOString()
            };

            if (isFirebaseConnected && db) {
                db.ref('pccc_data/roads/' + roadData.id).set(roadData);
            } else {
                saveToLocalStorage('roads', roadData);
            }

            closeModal('saveRoadModal');
            resetRoadPoints();
            loadAndRenderData();
            alert(`✅ Đã phân loại & lưu tuyến ngõ thành công! [${classInfo.label}]`);
        }

        function saveToLocalStorage(key, item) {
            const existing = JSON.parse(localStorage.getItem('pccc_' + key) || '[]');
            existing.push(item);
            localStorage.setItem('pccc_' + key, JSON.stringify(existing));
        }

        function getFromLocalStorage(key) {
            return JSON.parse(localStorage.getItem('pccc_' + key) || '[]');
        }

        function removeFromLocalStorage(key, id) {
            const existing = JSON.parse(localStorage.getItem('pccc_' + key) || '[]');
            const filtered = existing.filter(item => item.id !== id);
            localStorage.setItem('pccc_' + key, JSON.stringify(filtered));
        }

        // ==========================================
        // 8. TẢI VÀ VẼ DỮ LIỆU LÊN BẢN ĐỒ
        // ==========================================
        function loadAndRenderData() {
            savedPointsGroup.clearLayers();
            savedRegionsGroup.clearLayers();
            savedRoadsGroup.clearLayers();
            ppgisReportsGroup.clearLayers();

            if (isFirebaseConnected && db) {
                db.ref('pccc_data').on('value', (snapshot) => {
                    savedPointsGroup.clearLayers();
                    savedRegionsGroup.clearLayers();
                    savedRoadsGroup.clearLayers();
                    ppgisReportsGroup.clearLayers();

                    const data = snapshot.val() || {};
                    window.cachedPoints = Object.values(data.points || {});
                    window.cachedRoads = Object.values(data.roads || {});

                    renderPoints(window.cachedPoints);
                    renderRegions(Object.values(data.regions || {}));
                    renderRoads(window.cachedRoads);
                    renderPPGIS(Object.values(data.ppgis || {}));
                });
            } else {
                renderPoints(getFromLocalStorage('points'));
                renderRegions(getFromLocalStorage('regions'));
                renderRoads(getFromLocalStorage('roads'));
                renderPPGIS(getFromLocalStorage('ppgis'));
            }
        }

        function renderPoints(pointsList) {
            pointsList.forEach(pt => {
                let iconHtml = '📍';
                let label = 'Điểm thu thập';
                if (pt.category === 'pccc_station') { iconHtml = '🚒'; label = 'Trạm PCCC'; }
                else if (pt.category === 'water_point') { iconHtml = '💧'; label = 'Điểm cấp nước'; }
                else if (pt.category === 'hospital') { iconHtml = '🏥'; label = 'Bệnh viện / Cơ sở y tế'; }

                const customIcon = L.divIcon({
                    className: 'custom-data-point-icon',
                    html: `<div style="font-size: 24px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.3));">${iconHtml}</div>`,
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });

                L.marker([pt.lat, pt.lng], { icon: customIcon })
                    .bindPopup(`<b>${iconHtml} ${pt.name}</b><br><span style="font-size: 11px; color: #64748b;">Phân loại: ${label}<br>Tọa độ: ${pt.lat.toFixed(5)}, ${pt.lng.toFixed(5)}</span>`)
                    .addTo(savedPointsGroup);
            });
        }

        function renderRegions(regionsList) {
            regionsList.forEach(rg => {
                const isWaterSurface = rg.category === 'water_surface';
                const color = isWaterSurface ? '#0284c7' : '#ea580c';
                const fillColor = isWaterSurface ? '#38bdf8' : '#fb923c';
                const label = isWaterSurface ? 'Bề mặt nước' : 'Cụm dân cư trong ngõ nhỏ';
                const iconHtml = isWaterSurface ? '🌊' : '🏘️';

                L.polygon(rg.vertices, { color: color, fillColor: fillColor, fillOpacity: 0.35, weight: 2.5 })
                    .bindPopup(`<b>${iconHtml} ${rg.name}</b><br><span style="font-size: 11px; color: #64748b;">Phân loại: ${label}<br>Số đỉnh: ${rg.vertices.length}</span>`)
                    .addTo(savedRegionsGroup);
            });
        }

        function renderRoads(roadsList) {
            roadsList.forEach(rd => {
                L.polyline(rd.path, { color: rd.color || '#2563eb', weight: 5, opacity: 0.85 })
                    .bindPopup(`
                        <div style="max-width: 200px;">
                            <b style="font-size: 13px; color: #0f172a;">🛣️ ${rd.name}</b><br>
                            <span style="font-size: 11px; color: #475569;">
                                <b>Độ rộng:</b> ${rd.width}m<br>
                                <b>Phân loại PCCC:</b> ${rd.categoryLabel}<br>
                                <span style="display:inline-block; margin-top:4px; font-size:10px; color:#334155;">${rd.description || ''}</span>
                            </span>
                        </div>
                    `).addTo(savedRoadsGroup);
            });
        }

        function renderPPGIS(ppgisList) {
            ppgisList.forEach(pg => {
                let iconHtml = '🤝';
                if (pg.category === 'obstacle') iconHtml = '🚫';
                else if (pg.category === 'electric_hazard') iconHtml = '⚡';
                else if (pg.category === 'damaged_hydrant') iconHtml = '💧';
                else if (pg.category === 'extinguisher') iconHtml = '🧯';

                const ppgisIcon = L.divIcon({
                    className: 'custom-ppgis-icon',
                    html: `<div style="font-size: 22px; filter: drop-shadow(0 3px 6px rgba(126,34,206,0.4));">${iconHtml}</div>`,
                    iconSize: [22, 22],
                    iconAnchor: [11, 11]
                });

                L.marker([pg.lat, pg.lng], { icon: ppgisIcon })
                    .bindPopup(`
                        <b>${iconHtml} [Phản ánh PPGIS] ${pg.title}</b><br>
                        <span style="font-size: 11px; color: #64748b;">Mô tả: ${pg.description || 'Không có mô tả thêm'}<br>Tọa độ: ${pg.lat.toFixed(5)}, ${pg.lng.toFixed(5)}</span>
                    `).addTo(ppgisReportsGroup);
            });
        }

        // ==========================================
        // 9. QUẢN LÝ MODAL & TAB DỮ LIỆU
        // ==========================================
        function openDataManagementModal() {
            renderDataManagementLists();
            openModal('dataManagementModal');
        }

        function switchDataTab(tab) {
            document.getElementById('tabPointsBtn').classList.toggle('active', tab === 'points');
            document.getElementById('tabRegionsBtn').classList.toggle('active', tab === 'regions');
            document.getElementById('tabRoadsBtn').classList.toggle('active', tab === 'roads');
            document.getElementById('tabPPGISBtn').classList.toggle('active', tab === 'ppgis');

            document.getElementById('pointsListContainer').style.display = tab === 'points' ? 'flex' : 'none';
            document.getElementById('regionsListContainer').style.display = tab === 'regions' ? 'flex' : 'none';
            document.getElementById('roadsListContainer').style.display = tab === 'roads' ? 'flex' : 'none';
            document.getElementById('ppgisListContainer').style.display = tab === 'ppgis' ? 'flex' : 'none';
        }

        function renderDataManagementLists() {
            if (isFirebaseConnected && db) {
                db.ref('pccc_data').once('value', (snapshot) => {
                    const data = snapshot.val() || {};
                    fillPointsList(Object.values(data.points || {}));
                    fillRegionsList(Object.values(data.regions || {}));
                    fillRoadsList(Object.values(data.roads || {}));
                    fillPPGISList(Object.values(data.ppgis || {}));
                });
            } else {
                fillPointsList(getFromLocalStorage('points'));
                fillRegionsList(getFromLocalStorage('regions'));
                fillRoadsList(getFromLocalStorage('roads'));
                fillPPGISList(getFromLocalStorage('ppgis'));
            }
        }

        function fillPointsList(points) {
            const container = document.getElementById('pointsListContainer');
            if (points.length === 0) {
                container.innerHTML = `<div style="padding: 20px; color: #94a3b8; font-size: 13px;">Chưa có điểm nào được thu thập.</div>`;
                return;
            }
            container.innerHTML = points.map(pt => {
                let badgeClass = 'badge-water';
                let badgeText = '📍 Điểm';
                if (pt.category === 'pccc_station') { badgeClass = 'badge-pccc'; badgeText = '🚒 Trạm PCCC'; }
                else if (pt.category === 'water_point') { badgeClass = 'badge-water'; badgeText = '💧 Điểm cấp nước'; }
                else if (pt.category === 'hospital') { badgeClass = 'badge-hospital'; badgeText = '🏥 Bệnh viện'; }

                return `
                    <div class="data-item-card">
                        <div class="data-item-info">
                            <div class="data-item-title">${pt.name}</div>
                            <div class="data-item-badge ${badgeClass}">${badgeText}</div>
                        </div>
                        <div class="data-item-actions">
                            <button class="item-action-btn" onclick="focusOnMap(${pt.lat}, ${pt.lng})" title="Xem trên bản đồ">👁️</button>
                            <button class="item-action-btn" onclick="deleteDataItem('points', '${pt.id}')" title="Xóa">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function fillRegionsList(regions) {
            const container = document.getElementById('regionsListContainer');
            if (regions.length === 0) {
                container.innerHTML = `<div style="padding: 20px; color: #94a3b8; font-size: 13px;">Chưa có vùng nào được thu thập.</div>`;
                return;
            }
            container.innerHTML = regions.map(rg => {
                const isWater = rg.category === 'water_surface';
                const badgeClass = isWater ? 'badge-water-surface' : 'badge-alley';
                const badgeText = isWater ? '🌊 Bề mặt nước' : '🏘️ Cụm dân cư ngõ nhỏ';
                const centerLat = rg.vertices && rg.vertices.length > 0 ? rg.vertices[0][0] : 21.028511;
                const centerLng = rg.vertices && rg.vertices.length > 0 ? rg.vertices[0][1] : 105.804817;

                return `
                    <div class="data-item-card">
                        <div class="data-item-info">
                            <div class="data-item-title">${rg.name}</div>
                            <div class="data-item-badge ${badgeClass}">${badgeText} (${rg.vertices.length} đỉnh)</div>
                        </div>
                        <div class="data-item-actions">
                            <button class="item-action-btn" onclick="focusOnMap(${centerLat}, ${centerLng})" title="Xem trên bản đồ">👁️</button>
                            <button class="item-action-btn" onclick="deleteDataItem('regions', '${rg.id}')" title="Xóa">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function fillRoadsList(roads) {
            const container = document.getElementById('roadsListContainer');
            if (roads.length === 0) {
                container.innerHTML = `<div style="padding: 20px; color: #94a3b8; font-size: 13px;">Chưa có tuyến ngõ nào được thu thập.</div>`;
                return;
            }
            container.innerHTML = roads.map(rd => {
                const classInfo = classifyRoad(rd.width);
                const firstLat = rd.path && rd.path.length > 0 ? rd.path[0][0] : 21.028511;
                const firstLng = rd.path && rd.path.length > 0 ? rd.path[0][1] : 105.804817;

                return `
                    <div class="data-item-card">
                        <div class="data-item-info">
                            <div class="data-item-title">${rd.name} (${rd.width}m)</div>
                            <div class="data-item-badge ${classInfo.badgeClass}">${classInfo.label}</div>
                        </div>
                        <div class="data-item-actions">
                            <button class="item-action-btn" onclick="focusOnMap(${firstLat}, ${firstLng})" title="Xem trên bản đồ">👁️</button>
                            <button class="item-action-btn" onclick="deleteDataItem('roads', '${rd.id}')" title="Xóa">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function fillPPGISList(ppgis) {
            const container = document.getElementById('ppgisListContainer');
            if (ppgis.length === 0) {
                container.innerHTML = `<div style="padding: 20px; color: #94a3b8; font-size: 13px;">Chưa có phản ánh PPGIS nào.</div>`;
                return;
            }
            container.innerHTML = ppgis.map(pg => {
                return `
                    <div class="data-item-card">
                        <div class="data-item-info">
                            <div class="data-item-title">${pg.title}</div>
                            <div class="data-item-badge badge-ppgis">🤝 Phản ánh cộng đồng</div>
                        </div>
                        <div class="data-item-actions">
                            <button class="item-action-btn" onclick="focusOnMap(${pg.lat}, ${pg.lng})" title="Xem trên bản đồ">👁️</button>
                            <button class="item-action-btn" onclick="deleteDataItem('ppgis', '${pg.id}')" title="Xóa">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function focusOnMap(lat, lng) {
            closeModal('dataManagementModal');
            map.flyTo([lat, lng], 17, { animate: true, duration: 1.2 });
        }

        function deleteDataItem(type, id) {
            if (!confirm("Bạn có chắc chắn muốn xóa dữ liệu này?")) return;

            if (isFirebaseConnected && db) {
                db.ref(`pccc_data/${type}/${id}`).remove();
            } else {
                removeFromLocalStorage(type, id);
            }

            loadAndRenderData();
            renderDataManagementLists();
        }

        // ==========================================
        // 10. ĐÓNG MỞ MODAL TIỆN ÍCH
        // ==========================================
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function closeModalOnOverlay(e) {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        }

        window.onload = function() {
            loadAndRenderData();
        };
    </script>
</body>
</html>
